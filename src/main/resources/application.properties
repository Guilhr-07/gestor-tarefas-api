spring.application.name=gestor-tarefas-api

# Banco H2 em memória (troque por PostgreSQL definindo as vars de ambiente abaixo)
spring.datasource.url=${DB_URL:jdbc:h2:mem:tarefas;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Console H2 em http://localhost:8080/h2-console (apenas dev)
spring.h2.console.enabled=true

# Observabilidade
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
